<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoirei 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 520px;
            padding: 24px;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .section {
            margin-bottom: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .section-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4a90e2;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; font-size: 13px; }
        .info-value {
            color: #333;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-btn {
            background: #4a90e2;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #357abd; }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .btn-save {
            flex: 1;
            padding: 12px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save:hover { background: #357abd; }
        .btn-report {
            flex: 1;
            padding: 12px;
            background: #52c41a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-report:hover { background: #45a815; }
        .btn-report:disabled { background: #d9d9d9; cursor: not-allowed; }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }
        .toggle-label { font-size: 13px; color: #555; }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch.on { background: #52c41a; }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: left 0.3s;
        }
        .toggle-switch.on::after { left: 22px; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-registered { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .status-not-registered { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffa39e; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #52c41a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #ff4d4f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yoirei 设置</h1>

        <div class="section">
            <div class="section-title">服务器配置</div>
            <div class="form-group">
                <label>后端接口地址</label>
                <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8080">
            </div>
        </div>

        <div class="section">
            <div class="section-title">自动上报</div>
            <div class="toggle-row">
                <span class="toggle-label">启用自动上报（启动时 + 每24小时）</span>
                <div class="toggle-switch" id="autoReportToggle" onclick="toggleAutoReport()"></div>
            </div>
            <div style="margin-top:10px; font-size:12px; color:#999;">
                设备ID：<span id="deviceIdDisplay">未注册</span>
                <span id="regBadge" class="status-badge status-not-registered">未注册</span>
            </div>
            <div class="btn-row">
                <button class="btn-report" id="reportBtn" onclick="manualReport()">立即上报</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">硬件信息（可点击复制）</div>
            <div class="info-row">
                <span class="info-label">主板 SN</span>
                <span class="info-value">
                    <span id="motherboardSn">--</span>
                    <button class="copy-btn" onclick="copyText('motherboardSn')">复制</button>
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">CPU 编号</span>
                <span class="info-value">
                    <span id="cpuId">--</span>
                    <button class="copy-btn" onclick="copyText('cpuId')">复制</button>
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">硬盘序列号</span>
                <span class="info-value">
                    <span id="diskSn">--</span>
                    <button class="copy-btn" onclick="copyText('diskSn')">复制</button>
                </span>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-save" onclick="saveConfig()">保存配置</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let hardwareInfo = {};
        let authState = { deviceId: 0, enabled: true };

        async function loadHardware() {
            try {
                const resp = await fetch('/api/hardware/info');
                hardwareInfo = await resp.json();
                document.getElementById('motherboardSn').textContent = hardwareInfo.motherboardSn || '--';
                document.getElementById('cpuId').textContent = hardwareInfo.cpuId || '--';
                document.getElementById('diskSn').textContent = hardwareInfo.diskSn || '--';
            } catch(e) { console.error('获取硬件信息失败:', e); }
        }

        async function loadAuthState() {
            try {
                const resp = await fetch('/api/auth/status');
                authState = await resp.json();
                updateAuthUI();
            } catch(e) {}
        }

        function updateAuthUI() {
            const toggle = document.getElementById('autoReportToggle');
            const badge = document.getElementById('regBadge');
            const display = document.getElementById('deviceIdDisplay');
            
            if (authState.enabled) {
                toggle.classList.add('on');
            } else {
                toggle.classList.remove('on');
            }
            if (authState.deviceId > 0) {
                display.textContent = 'ID: ' + authState.deviceId;
                badge.textContent = '已注册';
                badge.className = 'status-badge status-registered';
            } else {
                display.textContent = '未注册';
                badge.textContent = '未注册';
                badge.className = 'status-badge status-not-registered';
            }
        }

        async function toggleAutoReport() {
            authState.enabled = !authState.enabled;
            const toggle = document.getElementById('autoReportToggle');
            toggle.classList.toggle('on', authState.enabled);
            try {
                await fetch('/api/auth/status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: authState.enabled})
                });
                updateAuthUI();
            } catch(e) { showToast('保存失败', true); }
        }

        async function manualReport() {
            const btn = document.getElementById('reportBtn');
            btn.disabled = true;
            btn.textContent = '上报中...';
            try {
                const resp = await fetch('/api/auth/report', {method: 'POST'});
                if (resp.ok) {
                    showToast('上报成功');
                    await loadAuthState();
                } else {
                    showToast('上报失败', true);
                }
            } catch(e) { showToast('网络错误', true); }
            btn.disabled = false;
            btn.textContent = '立即上报';
        }

        async function loadConfig() {
            try {
                const resp = await fetch('/api/config/get');
                const config = await resp.json();
                if (config.serverUrl) {
                    document.getElementById('serverUrl').value = config.serverUrl;
                }
            } catch(e) {}
        }

        async function saveConfig() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            try {
                await fetch('/api/config/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({serverUrl})
                });
                showToast('保存成功');
            } catch(e) { showToast('保存失败', true); }
        }

        function copyText(id) {
            const text = document.getElementById(id).textContent;
            navigator.clipboard.writeText(text).then(() => showToast('已复制'));
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        loadHardware();
        loadAuthState();
        loadConfig();
    </script>
</body>
</html>
