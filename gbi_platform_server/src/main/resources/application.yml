# =====================================================
# 集团业务一体化管控平台 - 公共基础配置（通用不变项）
# 环境差异化配置见 application-dev.yml / application-prod.yml
# =====================================================
spring:
  application:
    name: gbi_platform_server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除全局配置（审计日志/财务流水等无 is_delete 字段的表自动豁免）
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc.html

# 业务自定义配置
gbi:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖，禁止提交真实密钥
    secret: ${JWT_SECRET:GbiPlatform@2026#DevOnlyDefaultKey}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  upload-dir: ${UPLOAD_DIR:./upload}

# 企业微信配置
# token / encoding-aes-key 必须在环境变量中注入，禁止硬编码
wecom:
  token: ${WECOM_TOKEN:dev-placeholder-token}
  encoding-aes-key: ${WECOM_AES_KEY:dev-placeholder-aes-key-43chars}
  callback-url: ${WECOM_CALLBACK_URL:https://dev-placeholder.com/api/wecom/callback}
  web-url: ${SYSTEM_WEB_URL:https://dev-placeholder.com}
  connect-timeout: 5000
  read-timeout: 10000
  max-retry-count: 3